[package]
name = "randanarana"
version = "0.1.0"
edition = "2024"
description = "Rename files to random alphanumeric names, keeping extensions"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
rand = "0.10.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
